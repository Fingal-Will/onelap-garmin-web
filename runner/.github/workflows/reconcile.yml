name: 核对并补同步
run-name: 核对 · ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      target_regions:
        description: 核对区域（CN 中国区，GLOBAL 国际区）
        type: choice
        required: true
        default: CN,GLOBAL
        options: ["CN,GLOBAL", "CN", "GLOBAL"]
      recent_activities:
        description: 按时间从新到旧核对最近多少条活动
        type: choice
        required: true
        default: "20"
        options: ["1", "10", "20", "50", "100", "200"]
      dry_run:
        description: 只核对并记录结果，不补传
        type: boolean
        default: true
      request_id:
        description: 网页请求编号（自动填写）
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: onelap-garmin-ledger
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || vars.SYNC_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      WEB_WORKFLOW: reconcile
      GARMIN_DEVICE_PRODUCT_ID: ${{ vars.GARMIN_DEVICE_PRODUCT_ID }}
      GARMIN_DEVICE_SOFTWARE_VERSION: ${{ vars.GARMIN_DEVICE_SOFTWARE_VERSION }}
      GARMINIZE_FIT_ENABLED: ${{ vars.GARMINIZE_FIT_ENABLED }}
      FIT_COORDINATE_TRANSFORM_ENABLED: ${{ vars.FIT_COORDINATE_TRANSFORM_ENABLED }}
      SCHEDULE_ENABLED: ${{ vars.SYNC_ENABLED }}
      SCHEDULE_TARGETS: ${{ vars.SYNC_TARGETS || 'CN,GLOBAL' }}
      SYNC_MAX_RETRIES: "8"
      SYNC_DATA_DIR: data
      SYNC_DRY_RUN: "true"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: 检查私有仓库和默认分支
        id: guard
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" != "true" || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::同步仅允许在私有仓库的默认分支运行。"
            exit 1
          fi

      - name: 检出默认分支
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: 准备并验证请求
        run: python3 scripts/prepare_request.py

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: 安装运行依赖
        run: |
          python -m pip install --require-hashes --requirement requirements.lock
          npm ci --ignore-scripts

      - name: 验证顽鹿账号并恢复会话
        env:
          ONELAP_ACCOUNT: ${{ secrets.ONELAP_ACCOUNT }}
          ONELAP_PASSWORD: ${{ secrets.ONELAP_PASSWORD }}
          ONELAP_SESSION_KEY: ${{ secrets.ONELAP_SESSION_KEY }}
          ONELAP_TOKEN: ${{ secrets.ONELAP_TOKEN }}
          ONELAP_REFRESH_TOKEN: ${{ secrets.ONELAP_REFRESH_TOKEN }}
        run: python -m onelap_garmin_sync check-onelap

      - name: 核对并补同步
        env:
          ONELAP_ACCOUNT: ${{ secrets.ONELAP_ACCOUNT }}
          ONELAP_PASSWORD: ${{ secrets.ONELAP_PASSWORD }}
          ONELAP_SESSION_KEY: ${{ secrets.ONELAP_SESSION_KEY }}
          ONELAP_TOKEN: ${{ secrets.ONELAP_TOKEN }}
          ONELAP_REFRESH_TOKEN: ${{ secrets.ONELAP_REFRESH_TOKEN }}
          GARMIN_CN_OAUTH1: ${{ secrets.GARMIN_CN_OAUTH1 }}
          GARMIN_CN_OAUTH2: ${{ secrets.GARMIN_CN_OAUTH2 }}
          GARMIN_GLOBAL_OAUTH1: ${{ secrets.GARMIN_GLOBAL_OAUTH1 }}
          GARMIN_GLOBAL_OAUTH2: ${{ secrets.GARMIN_GLOBAL_OAUTH2 }}
          GARMIN_DEVICE_UNIT_ID: ${{ secrets.GARMIN_DEVICE_UNIT_ID }}
        run: python -m onelap_garmin_sync reconcile --recent-limit "$RECONCILE_RECENT_LIMIT"

      - name: 导出网页汇总
        if: ${{ always() && steps.guard.outcome == 'success' && steps.checkout.outcome == 'success' }}
        env:
          WEB_JOB_STATUS: ${{ job.status }}
        run: python3 scripts/write_status.py

      - name: 保存台账与汇总
        id: persist
        if: ${{ always() && steps.guard.outcome == 'success' && steps.checkout.outcome == 'success' }}
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup_git_credentials() {
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
            unset REPOSITORY_TOKEN basic_auth
          }
          trap cleanup_git_credentials EXIT

          files=()
          [[ ! -f data/sync.db ]] || files+=(data/sync.db)
          [[ ! -f data/web-status.json ]] || files+=(data/web-status.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            exit 0
          fi

          basic_auth="$(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          git config --local --replace-all http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic_auth}"
          unset REPOSITORY_TOKEN basic_auth

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git pull --ff-only "$remote" "$DEFAULT_BRANCH"; then
            echo "::error::读取最新台账失败，可能是远程分支与本次运行的本地数据冲突。不会覆盖远程；请从本次运行附件恢复台账后重试。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: save private sync ledger [skip ci]"
          if ! git push "$remote" "HEAD:$DEFAULT_BRANCH"; then
            echo "::error::保存台账失败，可能是远程分支有新提交或分支保护阻止推送。不会强制覆盖；请从本次运行附件恢复最新台账后重试。"
            exit 1
          fi

      - name: 保存失败时保留台账恢复附件
        if: ${{ failure() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-ledger-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/sync.db
            data/web-status.json
          if-no-files-found: ignore
          retention-days: 7
