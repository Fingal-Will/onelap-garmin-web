name: 检查网页控制台

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 运行测试
        run: npm test

      - name: 检查源码
        run: npm run check

      - name: 配置同步引擎 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements.lock

      - name: 安装同步引擎依赖
        run: |
          python -m pip install --require-hashes --requirement runner/requirements.lock
          npm --prefix runner ci --ignore-scripts

      - name: 检查同步引擎
        working-directory: runner
        run: |
          python -m unittest discover -s tests
          npm run check

      - name: 构建网页
        run: npm run build
